name: Bug report
description: Relate um problema encontrado no Celsius.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar o problema. Inclua o maximo de contexto possivel.
  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra...
        2. Clique...
        3. Veja o erro...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou erro
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Versao do Python
      placeholder: "Ex: Python 3.14.4"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Sistema operacional
      placeholder: "Ex: Windows 11"
    validations:
      required: false
