[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celsius"
version = "1.0.0"
description = "Celsius - Agente Multimodal de IA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Celso", email = "celso@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PySide6>=6.5,<7.0",
    "sentence-transformers>=2.2,<4.0",
    "numpy>=1.24,<2.0",
    "llama-cpp-python>=0.2.0,<1.0",
    "huggingface-hub>=0.20,<1.0",
    "structlog>=23.0,<25.0",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp>=1.20,<2.0",
    "opentelemetry-instrumentation>=1.20,<2.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "duckduckgo-search>=4.0,<7.0",
    "feedparser>=6.0,<7.0",
    "playwright>=1.40,<2.0",
    "SpeechRecognition>=3.10,<4.0",
    "sounddevice>=0.4,<1.0",
    "scipy>=1.10,<2.0",
    "edge-tts>=6.1,<7.0",
    "pygame-ce>=2.2,<3.0",
    "pydub>=0.25,<1.0",
    "openai-whisper>=20230918",
    "faster-whisper>=1.0,<2.0",
    "pypdf>=3.0,<5.0",
    "python-docx>=0.8,<2.0",
    "Pillow>=9.0,<11.0",
    "qrcode[pil]>=7.4,<9.0",
    "odfpy>=1.4,<2.0",
    "fpdf2>=2.7,<4.0",
    "matplotlib>=3.8,<4.0",
    "chromadb>=0.5,<2.0",
    "rank-bm25>=0.2,<1.0",
    "cryptography>=41.0,<44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-qt>=4.2,<5.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "hypothesis>=6.92,<7.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
    "bandit>=1.7,<2.0",
    "pip-tools>=7.0,<8.0",
    "pre-commit>=3.6,<5.0",
    "types-requests>=2.31,<3.0",
    "types-PyYAML>=6.0,<7.0",
]
test = [
    "pytest>=9.0.3,<10.0",
    "pytest-qt>=4.2,<5.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-xdist>=3.5,<4.0",
    "hypothesis>=6.92,<7.0",
]
security = [
    "pip-audit>=2.7,<3.0",
    "pip-tools>=7.0,<8.0",
    "bandit>=1.7,<2.0",
]

[project.urls]
Homepage = "https://github.com/celso/celsius"
Repository = "https://github.com/celso/celsius"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "core*", "processors*", "ui*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "SIM103", # return early (sometimes less readable)
    "T201",   # print statements (allowed for debugging)
    "S101",   # assert in tests
    "E402",   # module import not at top (Qt)
]
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/*" = ["S101", "T201", "F401", "F841", "I001", "E702", "E731", "SIM102"]
"ui/**/*.py" = ["N802"]
"ui/theme/tokens.py" = ["N815"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = false
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_cpp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[tool.pre-commit]
hooks = [
    {id = "ruff", args = ["--fix", "."]},
    {id = "ruff-format", args = ["."]},
    {id = "mypy"},
    {id = "pytest", args = ["-x", "--tb=short"]},
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]
