[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celsius"
version = "1.0.0"
description = "Celsius - Agente Multimodal de IA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Celso", email = "celso@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PySide6>=6.5",
    "sentence-transformers>=2.2,<4.0",
    "numpy>=1.24",
    "llama-cpp-python>=0.2.0",
    "huggingface-hub>=0.20",
    "structlog>=23.0",
    "duckduckgo-search>=4.0",
    "SpeechRecognition>=3.10",
    "sounddevice>=0.4",
    "scipy>=1.10",
    "edge-tts>=6.1",
    "pygame-ce>=2.2",
    "pypdf>=3.0",
    "python-docx>=0.8",
    "Pillow>=9.0",
    "openai-whisper>=20230918",
    "odfpy>=1.4",
    "fpdf2>=2.7",
    "pydub>=0.25",
    "chromadb>=0.5",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "pip-tools>=7.0",
    "pre-commit>=3.6",
]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]
security = [
    "pip-audit>=2.7",
    "pip-tools>=7.0",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/celso/celsius"
Repository = "https://github.com/celso/celsius"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "core*", "processors*", "ui*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "SIM103", # return early (sometimes less readable)
    "T201",   # print statements (allowed for debugging)
    "S101",   # assert in tests
    "E402",   # module import not at top (Qt)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = false
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.pre-commit]
hooks = [
    {id = "ruff", args = ["--fix", "."]},
    {id = "ruff-format", args = ["."]},
    {id = "mypy"},
    {id = "pytest", args = ["-x", "--tb=short"]},
]